name: Container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Python for the CalDAV fixture
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Start Radicale CalDAV fixture
        run: |
          python -m pip install Radicale==3.7.7
          mkdir -p /tmp/caldav-mcp-radicale
          printf 'test:test\n' > /tmp/caldav-mcp-radicale/users
          nohup python -m radicale \
            --config "" \
            --server-hosts 127.0.0.1:5232 \
            --storage-filesystem-folder /tmp/caldav-mcp-radicale/data \
            --auth-type htpasswd \
            --auth-htpasswd-filename /tmp/caldav-mcp-radicale/users \
            --auth-htpasswd-encryption plain \
            --rights-type owner_only \
            > /tmp/caldav-mcp-radicale/server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent --user test:test http://127.0.0.1:5232/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/caldav-mcp-radicale/server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --user test:test \
            --request MKCALENDAR \
            --header 'Content-Type: application/xml; charset=utf-8' \
            --data '<?xml version="1.0" encoding="UTF-8"?><c:mkcalendar xmlns:d="DAV:" xmlns:c="urn:ietf:params:xml:ns:caldav"><d:set><d:prop><d:displayname>Integration</d:displayname><c:supported-calendar-component-set><c:comp name="VEVENT"/></c:supported-calendar-component-set></d:prop></d:set></c:mkcalendar>' \
            http://127.0.0.1:5232/test/calendar/

      - name: Run integration tests
        run: pnpm test:integration
        env:
          RADICALE_URL: http://127.0.0.1:5232

      - name: Build application
        run: pnpm build

      - name: Smoke-test npm package
        run: pnpm test:package

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build container without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
