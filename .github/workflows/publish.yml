name: Publish release

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate release versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          SERVER_VERSION=$(jq -r '.version' server.json)
          NPM_PACKAGE_VERSION=$(jq -r '.packages[] | select(.registryType == "npm") | .version' server.json)
          OCI_IDENTIFIER=$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)

          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
          test "$RELEASE_VERSION" = "$PACKAGE_VERSION"
          test "$SERVER_VERSION" = "$PACKAGE_VERSION"
          test "$NPM_PACKAGE_VERSION" = "$PACKAGE_VERSION"
          test "$OCI_IDENTIFIER" = "ghcr.io/${GITHUB_REPOSITORY}:$PACKAGE_VERSION"

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Set up Python for the CalDAV fixture
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Start Radicale CalDAV fixture
        run: |
          python -m pip install Radicale==3.7.7
          mkdir -p /tmp/caldav-mcp-radicale
          printf 'test:test\n' > /tmp/caldav-mcp-radicale/users
          nohup python -m radicale \
            --config "" \
            --server-hosts 127.0.0.1:5232 \
            --storage-filesystem-folder /tmp/caldav-mcp-radicale/data \
            --auth-type htpasswd \
            --auth-htpasswd-filename /tmp/caldav-mcp-radicale/users \
            --auth-htpasswd-encryption plain \
            --rights-type owner_only \
            > /tmp/caldav-mcp-radicale/server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent --user test:test http://127.0.0.1:5232/ > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              cat /tmp/caldav-mcp-radicale/server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --user test:test \
            --request MKCALENDAR \
            --header 'Content-Type: application/xml; charset=utf-8' \
            --data '<?xml version="1.0" encoding="UTF-8"?><c:mkcalendar xmlns:d="DAV:" xmlns:c="urn:ietf:params:xml:ns:caldav"><d:set><d:prop><d:displayname>Integration</d:displayname><c:supported-calendar-component-set><c:comp name="VEVENT"/></c:supported-calendar-component-set></d:prop></d:set></c:mkcalendar>' \
            http://127.0.0.1:5232/test/calendar/

      - name: Run integration tests
        run: pnpm test:integration
        env:
          RADICALE_URL: http://127.0.0.1:5232

      - name: Build application
        run: pnpm build

      - name: Smoke-test npm package
        run: pnpm test:package

      - name: Install mcp-publisher
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output mcp-publisher.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" \
            | sha256sum --check --strict
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing container image
        id: container
        run: |
          if docker manifest inspect "${REGISTRY}/${IMAGE_NAME}:${{ steps.versions.outputs.release_version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.container.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.container.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and publish versioned container
        if: steps.container.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.versions.outputs.release_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check existing npm package
        id: npm
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/@lukegskw/caldav-mcp/${{ steps.versions.outputs.release_version }}")
          if [ "$STATUS" = "200" ]; then
            PUBLISHED_GIT_HEAD=$(npm view "@lukegskw/caldav-mcp@${{ steps.versions.outputs.release_version }}" gitHead)
            test "$PUBLISHED_GIT_HEAD" = "$GITHUB_SHA"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected npm registry response: $STATUS"
            exit 1
          fi

      - name: Publish to npm
        if: steps.npm.outputs.exists != 'true'
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for npm propagation
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent \
              "https://registry.npmjs.org/@lukegskw/caldav-mcp/${{ steps.versions.outputs.release_version }}" \
              > /dev/null; then
              exit 0
            fi
            echo "Waiting for npm propagation ($attempt/20)"
            sleep 15
          done
          echo "Timed out waiting for npm propagation"
          exit 1

      - name: Check existing MCP Registry version
        id: mcp_registry
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0.1/servers/io.github.lukegskw%2Fcaldav-mcp/versions/${{ steps.versions.outputs.release_version }}")
          if [ "$STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected MCP Registry response: $STATUS"
            exit 1
          fi

      - name: Authenticate to MCP Registry
        if: steps.mcp_registry.outputs.exists != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.mcp_registry.outputs.exists != 'true'
        run: ./mcp-publisher publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
